name: Update Spec

# The clients are generated from Roblox's Open Cloud spec at the creator-docs
# commit pinned in spec/source.luau. This moves the pin to the newest spec
# every week, regenerates the clients, and opens a PR, or updates the open one,
# when a client changes.

on:
  schedule:
    # Mondays at 15:00 UTC. The hour doesn't matter; a spec change waits at
    # most a week to be picked up.
    - cron: "0 15 * * 1"
  workflow_dispatch:

env:
  BRANCH: update-spec
  ENTRY_PATH: .changes/update-spec.luau

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: update-spec
    steps:
      # PRs and pushes made with the default token don't trigger other
      # workflows, so CI would never run on the update PR. The App token's do.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FLIPBOOK_BACKEND_CLIENT_ID }}
          private-key: ${{ secrets.FLIPBOOK_BACKEND_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          ref: main

      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0

      - name: Pin the newest spec
        run: lute run update-spec

      - name: Regenerate the clients
        run: lute run generate

      # The spec covers every Open Cloud service, so it often changes in ways
      # that leave these clients alone. Only a client change is worth a PR.
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- workspace; then
            echo "No client changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "commit=$(grep -oE '[0-9a-f]{40}' spec/source.luau)" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMIT: ${{ steps.changes.outputs.commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          short="${COMMIT:0:7}"

          # CI requires a changelog entry on every PR. A regeneration can add
          # operations or change existing ones, so it starts as a minor bump
          # for the reviewer to raise to major when a change breaks callers.
          cat > "$ENTRY_PATH" <<EOF
          return {
          	bump = "minor",
          	category = "Changes",
          	summary = "Regenerate the clients from Roblox's Open Cloud spec at Roblox/creator-docs@$short.",
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add spec workspace "$ENTRY_PATH"
          git commit -m "Regenerate clients from creator-docs@$short"

          # The branch belongs to this job and is rebuilt from main on every
          # run. When the open PR already holds the same clients on top of the
          # current main, pushing again would only rerun its CI.
          number="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [ -n "$number" ] \
            && git fetch origin "$BRANCH" 2>/dev/null \
            && git merge-base --is-ancestor origin/main FETCH_HEAD \
            && git diff --quiet FETCH_HEAD HEAD -- workspace; then
            echo "The open PR is already up to date."
            exit 0
          fi
          git push --force origin "$BRANCH"

          cat > "$RUNNER_TEMP/body.md" <<EOF
          Roblox updated its Open Cloud spec in [Roblox/creator-docs@$short](https://github.com/Roblox/creator-docs/commit/$COMMIT), and the change reaches at least one client here. This PR moves the pin in \`spec/source.luau\` to that commit and regenerates the clients with \`lute run generate\`.

          Check the client diffs for removed operations or changed fields. If a change breaks callers, raise the changelog entry's bump to \`major\`.

          🤖 This PR was generated by [this run]($RUN_URL).
          EOF
          title="Regenerate clients from creator-docs@$short"
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
